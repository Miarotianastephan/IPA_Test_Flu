name: iOS-ipa-build
on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v3
      
      # 🔐 Restore Firebase config
      - name: Restore GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "✅ GoogleService-Info.plist restored"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      - name: Check environment
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Clean project
        run: flutter clean

      # ✅ Force safe version of device_info_plus before resolving deps
      - name: Pin device_info_plus to safe version
        run: |
          sed -i '' 's/device_info_plus:.*/device_info_plus: ^10.1.2/' pubspec.yaml
          echo "--- device_info_plus line after patch ---"
          grep device_info_plus pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      # Verify the pinned version is effectively used
      - name: Verify device_info_plus version
        run: flutter pub deps | grep device_info_plus

      # 🧹 Full CocoaPods reset
      - name: Clean CocoaPods cache
        run: |
          cd ios
          rm -rf Podfile.lock Pods .symlinks
          pod cache clean --all

      # 🔄 Install CocoaPods with deintegrate + reinstall
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod deintegrate || true
          pod install --repo-update
          echo "✅ pod install done"

      # 🔍 Verify Firebase pods are present
      - name: Verify Firebase pods
        run: |
          ls ios/Pods/Firebase || echo "⚠️ Firebase pod folder not found!"
          grep -r "Firebase" ios/Podfile.lock | head -10

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign

      - name: Create Payload
        run: mkdir Payload
        working-directory: build/ios/iphoneos

      - name: Move app
        run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip IPA
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload IPA
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0-${{ steps.timestamp.outputs.timestamp }}
          overwrite: true
