name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      - name: Check environment
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      # ✅ Nettoyage AVANT pub get
      - name: Clean project
        run: flutter clean

      # ✅ Installer les dépendances
      - name: Install dependencies
        run: flutter pub get

      # Clean CocoaPods cache and lockfile
      - name: Clean CocoaPods cache
        run: |
          cd ios
          rm -rf Podfile.lock Pods

      # Update CocoaPods repos
      - name: Update CocoaPods repos
        run: pod repo update
        working-directory: ios

      # Install CocoaPods dependencies (with repo-update for freshness)
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - run: pod repo update
        working-directory: ios

      # ✅ Build final release
      - name: Build iOS Release
        run: flutter build ios --release --no-codesign

      # 📦 Création IPA
      - name: Create Payload
        run: mkdir Payload
        working-directory: build/ios/iphoneos

      - name: Move app
        run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip IPA
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      # 🏷 Tag dynamique
      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # 🚀 Upload
      - name: Upload IPA
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0-${{ steps.timestamp.outputs.timestamp }}
          overwrite: true
