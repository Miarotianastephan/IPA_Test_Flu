  <script id="canvas-player-script">
    /**
     * Démarre une boucle requestAnimationFrame qui copie les frames
     * du <video> caché vers le <canvas> visible (letterboxing).
     * @param {HTMLVideoElement} video - élément de décodage (caché)
     * @param {HTMLCanvasElement} canvas - surface de rendu (visible)
     * @returns {Function} fonction stop() à appeler pour arrêter la boucle
     */
    function startCanvasRenderLoop(video, canvas) {
      var rafId = null;
      var stopped = false;

      function drawFrame() {
        if (stopped) return;

        if (video.readyState >= 2) {
          var vw = video.videoWidth;
          var vh = video.videoHeight;

          if (canvas.width !== vw || canvas.height !== vh) {
            canvas.width  = vw || canvas.offsetWidth;
            canvas.height = vh || canvas.offsetHeight;
          }

          if (vw > 0 && vh > 0) {
            var ctx = canvas.getContext('2d');
            var cw = canvas.width;
            var ch = canvas.height;
            var scale = Math.min(cw / vw, ch / vh);
            var dw = vw * scale;
            var dh = vh * scale;
            var dx = (cw - dw) / 2;
            var dy = (ch - dh) / 2;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, cw, ch);
            ctx.drawImage(video, dx, dy, dw, dh);
          }
        }

        rafId = requestAnimationFrame(drawFrame);
      }

      rafId = requestAnimationFrame(drawFrame);

      return function stopLoop() {
        stopped = true;
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      };
    }
  </script>
  <script id="hls-loader-script">
    window.loadMediaKitHls = function () {
      if (window.Hls) {
        return Promise.resolve();
      }

      if (window.__mediaKitHlsPromise) {
        return window.__mediaKitHlsPromise;
      }

      window.__mediaKitHlsPromise = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'assets/packages/media_kit/assets/web/hls1.4.10.js';
        script.type = 'application/javascript';
        script.onload = function () {
          resolve();
        };
        script.onerror = function () {
          window.__mediaKitHlsPromise = null;
          reject(new Error('Failed to load media_kit hls.js'));
        };
        document.body.appendChild(script);
      });

      return window.__mediaKitHlsPromise;
    };
  </script>

<body>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => {
            const workers = [registration.active, registration.installing, registration.waiting];
            const hasFlutterWorker = workers.some((worker) => {
              return worker && worker.scriptURL && worker.scriptURL.indexOf('flutter_service_worker.js') !== -1;
            });

            if (hasFlutterWorker) {
              registration.unregister();
            }
          });
        }).catch(() => {});

        if (window.caches) {
          caches.keys().then((keys) => {
            keys
              .filter((key) => key.indexOf('flutter-') === 0)
              .forEach((key) => caches.delete(key));
          }).catch(() => {});
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async=""></script>
  <script>
    function changeFavicon(url) {
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.type = 'image/icon';
      link.href = url;
    }
  </script>
